[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
# Foundry 1.10 runs tests isolated by default (each call is its own transaction, +21k base and calldata),
# which breaks the per-call gas tests; pin the mode the gas numbers in docs/review.md were measured in.
isolate = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "reactive-lib/=lib/reactive-lib-omni/src/",
]

[fuzz]
runs = 256
